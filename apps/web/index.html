    <title>Parcháte Bogotá</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("parchexbogota-theme");
          // Predeterminado: noche. Solo claro si el usuario lo eligió.
          if (t !== "light") {
            document.documentElement.setAttribute("data-theme", "dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#141210");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
