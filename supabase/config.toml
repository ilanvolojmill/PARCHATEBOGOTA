project_id = "parchexbogota"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5180"
additional_redirect_urls = ["http://localhost:5180", "https://parchexbogota.com", "com.parchexbogota.app://"]

# Activar en Dashboard → Authentication → Providers:
# - Google
# - Azure (Microsoft)
# - Apple

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "5MB"

[realtime]
enabled = true
